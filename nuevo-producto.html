<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuevo Producto — StyleShop</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>

  <!-- Barra superior -->
  <header class="topbar">
    <div class="topbar-brand"><i class="bi bi-bag-fill"></i> StyleShop</div>
    <div class="topbar-spacer"></div>
    <div class="topbar-actions">
      <i class="bi bi-bell"></i>
      <i class="bi bi-gear"></i>
      <div class="topbar-avatar">AD</div>
    </div>
  </header>

  <!-- Barra de navegación -->
  <nav class="subnav">
    <div class="subnav-inner">
    <a href="dashboard.html"><i class="bi bi-speedometer2"></i> Inicio</a>
    <a href="productos.html" class="active"><i class="bi bi-box-seam"></i> Productos</a>
    <a href="ventas.html"><i class="bi bi-receipt"></i> Ventas</a>
    <a href="categorias.html"><i class="bi bi-tags"></i> Categorías</a>
    <a href="clientes.html"><i class="bi bi-people"></i> Clientes</a>
    <a href="pagos.html"><i class="bi bi-credit-card"></i> Pagos</a>
    <a href="login.html" class="subnav-end"><i class="bi bi-box-arrow-right"></i> Salir</a>
    </div>
  </nav>

  <main class="page-content">

    <div class="page-header">
      <h1><i class="bi bi-box-seam"></i> Nuevo Producto</h1>
      <a href="productos.html" class="btn-secondary"><i class="bi bi-arrow-left"></i> Volver</a>
    </div>

    <section class="form-card">
      <div class="form-card-title"><i class="bi bi-box-seam"></i> Información del producto</div>
      <form action="productos.html">
        <div class="form-group">
          <label for="sku">Código SKU</label>
          <input type="text" id="sku" name="sku" placeholder="Ej: CAM-001" />
        </div>
        <div class="form-group">
          <label for="nombre">Nombre del producto</label>
          <input type="text" id="nombre" name="nombre" placeholder="Ej: Camisa Oxford Blanca" required />
        </div>
        <div class="form-group">
          <label for="color">Color</label>
          <input type="text" id="color" name="color" placeholder="Ej: Blanco, Negro, Azul" />
        </div>
        <div class="form-group">
          <label for="categoria">Categoría</label>
          <select id="categoria" name="categoria">
            <option value="">-- Seleccionar --</option>
            <option>Camisas</option><option>Pantalones</option>
            <option>Chaquetas</option><option>Accesorios</option>
          </select>
        </div>
        <div class="form-group">
          <label for="talla">Talla</label>
          <select id="talla" name="talla">
            <option value="">-- Seleccionar --</option>
            <option>XS</option><option>S</option><option>M</option>
            <option>L</option><option>XL</option><option>XXL</option>
          </select>
        </div>
        <div class="form-group">
          <label for="precio">Precio ($)</label>
          <input type="number" id="precio" name="precio" placeholder="0.00" min="0" step="0.01" required />
        </div>
        <div class="form-group">
          <label for="stock">Stock</label>
          <input type="number" id="stock" name="stock" placeholder="0" min="0" required />
        </div>
        <div class="form-group">
          <label for="descripcion">Descripción</label>
          <textarea id="descripcion" name="descripcion" placeholder="Descripción del producto..."></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary"><i class="bi bi-floppy"></i> Guardar</button>
          <a href="productos.html" class="btn-cancel"><i class="bi bi-x-lg"></i> Cancelar</a>
        </div>
      </form>
    </section>

  </main>

  <footer class="page-footer">
    <p>© 2026 StyleShop · Sistema de Gestión</p>
  </footer>

</body>
</html>
