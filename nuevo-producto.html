<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuevo Producto — StyleShop</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>

  <header class="topbar">
    <div class="topbar-brand"><i class="bi bi-bag-fill"></i> StyleShop</div>
    <nav class="topbar-nav">
      <a href="dashboard.html"><i class="bi bi-house-door"></i> Inicio</a>
      <a href="productos.html" class="active"><i class="bi bi-box-seam"></i> Productos</a>
      <a href="ventas.html"><i class="bi bi-receipt"></i> Ventas</a>
      <a href="categorias.html"><i class="bi bi-tags"></i> Categorías</a>
      <a href="clientes.html"><i class="bi bi-people"></i> Clientes</a>
    </nav>
    <a href="login.html" class="btn-logout"><i class="bi bi-box-arrow-right"></i> Salir</a>
  </header>

  <main class="page-content">

    <div class="page-header">
      <h1><i class="bi bi-box-seam"></i> Nuevo Producto</h1>
      <a href="productos.html" class="btn-cancel"><i class="bi bi-arrow-left"></i> Volver</a>
    </div>

    <section class="form-card">
      <form action="productos.html">

        <div class="form-group">
          <label for="nombre">Nombre del producto</label>
          <input type="text" id="nombre" name="nombre" placeholder="Ej: Camisa Oxford Blanca" required />
        </div>

        <div class="form-group">
          <label for="categoria">Categoría</label>
          <select id="categoria" name="categoria">
            <option value="">-- Seleccionar --</option>
            <option value="Camisas">Camisas</option>
            <option value="Pantalones">Pantalones</option>
            <option value="Chaquetas">Chaquetas</option>
            <option value="Accesorios">Accesorios</option>
          </select>
        </div>

        <div class="form-group">
          <label for="talla">Talla</label>
          <select id="talla" name="talla">
            <option value="">-- Seleccionar --</option>
            <option value="XS">XS</option>
            <option value="S">S</option>
            <option value="M">M</option>
            <option value="L">L</option>
            <option value="XL">XL</option>
            <option value="XXL">XXL</option>
          </select>
        </div>

        <div class="form-group">
          <label for="precio">Precio ($)</label>
          <input type="number" id="precio" name="precio" placeholder="0.00" min="0" step="0.01" required />
        </div>

        <div class="form-group">
          <label for="stock">Stock disponible</label>
          <input type="number" id="stock" name="stock" placeholder="0" min="0" required />
        </div>

        <div class="form-group">
          <label for="descripcion">Descripción</label>
          <textarea id="descripcion" name="descripcion" placeholder="Descripción del producto..."></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary"><i class="bi bi-floppy"></i> Guardar Producto</button>
          <a href="productos.html" class="btn-cancel"><i class="bi bi-x-lg"></i> Cancelar</a>
        </div>

      </form>
    </section>

  </main>

  <footer class="page-footer">
    <p>© 2026 StyleShop · Todos los derechos reservados</p>
  </footer>

</body>
</html>
