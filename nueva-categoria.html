<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nueva Categoría — StyleShop</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>

  <header class="topbar">
    <div class="topbar-brand"><i class="bi bi-bag-fill"></i> StyleShop</div>
    <nav class="topbar-nav">
      <a href="dashboard.html"><i class="bi bi-house-door"></i> Inicio</a>
      <a href="productos.html"><i class="bi bi-box-seam"></i> Productos</a>
      <a href="ventas.html"><i class="bi bi-receipt"></i> Ventas</a>
      <a href="categorias.html" class="active"><i class="bi bi-tags"></i> Categorías</a>
      <a href="clientes.html"><i class="bi bi-people"></i> Clientes</a>
    </nav>
    <a href="login.html" class="btn-logout"><i class="bi bi-box-arrow-right"></i> Salir</a>
  </header>

  <main class="page-content">

    <div class="page-header">
      <h1><i class="bi bi-tags"></i> Nueva Categoría</h1>
      <a href="categorias.html" class="btn-cancel"><i class="bi bi-arrow-left"></i> Volver</a>
    </div>

    <section class="form-card">
      <form action="categorias.html">

        <div class="form-group">
          <label for="nombre">Nombre de la categoría</label>
          <input type="text" id="nombre" name="nombre" placeholder="Ej: Camisas" required />
        </div>

        <div class="form-group">
          <label for="descripcion">Descripción</label>
          <textarea id="descripcion" name="descripcion" placeholder="Descripción de la categoría..."></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary"><i class="bi bi-floppy"></i> Guardar Categoría</button>
          <a href="categorias.html" class="btn-cancel"><i class="bi bi-x-lg"></i> Cancelar</a>
        </div>

      </form>
    </section>

  </main>

  <footer class="page-footer">
    <p>© 2026 StyleShop · Todos los derechos reservados</p>
  </footer>

</body>
</html>
