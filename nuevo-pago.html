<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrar Pago — StyleShop</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>

  <!-- Barra superior -->
  <header class="topbar">
    <div class="topbar-brand"><i class="bi bi-bag-fill"></i> StyleShop</div>
    <div class="topbar-spacer"></div>
    <div class="topbar-actions">
      <i class="bi bi-bell"></i>
      <i class="bi bi-gear"></i>
      <div class="topbar-avatar">AD</div>
    </div>
  </header>

  <!-- Barra de navegación -->
  <nav class="subnav">
    <div class="subnav-inner">
      <a href="dashboard.html"><i class="bi bi-speedometer2"></i> Inicio</a>
      <a href="productos.html"><i class="bi bi-box-seam"></i> Productos</a>
      <a href="ventas.html"><i class="bi bi-receipt"></i> Ventas</a>
      <a href="categorias.html"><i class="bi bi-tags"></i> Categorías</a>
      <a href="clientes.html"><i class="bi bi-people"></i> Clientes</a>
      <a href="pagos.html" class="active"><i class="bi bi-credit-card"></i> Pagos</a>
      <a href="login.html" class="subnav-end"><i class="bi bi-box-arrow-right"></i> Salir</a>
    </div>
  </nav>

  <main class="page-content">

    <div class="page-header">
      <h1><i class="bi bi-credit-card"></i> Registrar Pago</h1>
      <a href="pagos.html" class="btn-secondary"><i class="bi bi-arrow-left"></i> Volver</a>
    </div>

    <section class="form-card">
      <div class="form-card-title"><i class="bi bi-credit-card"></i> Datos del pago</div>
      <form action="pagos.html">

        <div class="form-group">
          <label for="venta">N° de Venta</label>
          <select id="venta" name="venta" required>
            <option value="">-- Seleccionar venta --</option>
            <option>VTA-0001 — Carlos Mamani — $90.00</option>
            <option>VTA-0002 — Luis Quispe — $60.00</option>
            <option>VTA-0003 — Pedro Flores — $95.00</option>
            <option>VTA-0004 — José Rojas — $90.00</option>
            <option>VTA-0005 — Marco Condori — $150.00</option>
          </select>
        </div>

        <div class="form-group">
          <label for="monto">Monto ($)</label>
          <input type="number" id="monto" name="monto" placeholder="0.00" min="0" step="0.01" required />
        </div>

        <div class="form-group">
          <label for="metodo">Método de pago</label>
          <select id="metodo" name="metodo" required>
            <option value="">-- Seleccionar --</option>
            <option>Efectivo</option>
            <option>Tarjeta de crédito</option>
            <option>Tarjeta de débito</option>
            <option>Transferencia bancaria</option>
            <option>QR</option>
          </select>
        </div>

        <div class="form-group">
          <label for="referencia">N° Referencia</label>
          <input type="text" id="referencia" name="referencia" placeholder="Ej: TRF-2026-0089 (opcional)" />
        </div>

        <div class="form-group">
          <label for="fecha">Fecha de pago</label>
          <input type="date" id="fecha" name="fecha" required />
        </div>

        <div class="form-group">
          <label for="estado">Estado</label>
          <select id="estado" name="estado" required>
            <option>Pagado</option>
            <option>Pendiente</option>
            <option>Sin pagar</option>
          </select>
        </div>

        <div class="form-group">
          <label for="notas">Notas</label>
          <textarea id="notas" name="notas" placeholder="Observaciones del pago..."></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary"><i class="bi bi-floppy"></i> Guardar</button>
          <a href="pagos.html" class="btn-cancel"><i class="bi bi-x-lg"></i> Cancelar</a>
        </div>

      </form>
    </section>

  </main>

  <footer class="page-footer">
    <p>© 2026 StyleShop · Sistema de Gestión</p>
  </footer>

</body>
</html>
