<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuevo Cliente — Tienda de Ropa</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>

  <header class="topbar">
    <div class="topbar-brand">👔 StyleShop</div>
    <nav class="topbar-nav">
      <a href="dashboard.html">Inicio</a>
      <a href="productos.html">Productos</a>
      <a href="ventas.html">Ventas</a>
      <a href="categorias.html">Categorías</a>
      <a href="clientes.html" class="active">Clientes</a>
    </nav>
    <a href="login.html" class="btn-logout">Salir</a>
  </header>

  <main class="page-content">

    <div class="page-header">
      <h1>Nuevo Cliente</h1>
      <a href="clientes.html" class="btn-cancel">← Volver</a>
    </div>

    <section class="form-card">
      <form action="clientes.html">

        <div class="form-group">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" name="nombre" placeholder="Ej: Carlos Mamani" required />
        </div>

        <div class="form-group">
          <label for="correo">Correo electrónico</label>
          <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" />
        </div>

        <div class="form-group">
          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" name="telefono" placeholder="Ej: 70012345" />
        </div>

        <div class="form-group">
          <label for="direccion">Dirección</label>
          <input type="text" id="direccion" name="direccion" placeholder="Ej: La Paz, Bolivia" />
        </div>

        <div class="form-group">
          <label for="notas">Notas</label>
          <textarea id="notas" name="notas" placeholder="Información adicional del cliente..."></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary">Guardar Cliente</button>
          <a href="clientes.html" class="btn-cancel">Cancelar</a>
        </div>

      </form>
    </section>

  </main>

  <footer class="page-footer">
    <p>© 2026 StyleShop · Todos los derechos reservados</p>
  </footer>

</body>
</html>
