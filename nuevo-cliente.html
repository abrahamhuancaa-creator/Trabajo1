<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuevo Cliente — StyleShop</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>

  <!-- Barra superior -->
  <header class="topbar">
    <div class="topbar-brand"><i class="bi bi-bag-fill"></i> StyleShop</div>
    <div class="topbar-spacer"></div>
    <div class="topbar-actions">
      <i class="bi bi-bell"></i>
      <i class="bi bi-gear"></i>
      <div class="topbar-avatar">AD</div>
    </div>
  </header>

  <!-- Barra de navegación -->
  <nav class="subnav">
    <div class="subnav-inner">
    <a href="dashboard.html"><i class="bi bi-speedometer2"></i> Inicio</a>
    <a href="productos.html"><i class="bi bi-box-seam"></i> Productos</a>
    <a href="ventas.html"><i class="bi bi-receipt"></i> Ventas</a>
    <a href="categorias.html"><i class="bi bi-tags"></i> Categorías</a>
    <a href="clientes.html" class="active"><i class="bi bi-people"></i> Clientes</a>
    <a href="pagos.html"><i class="bi bi-credit-card"></i> Pagos</a>
    <a href="login.html" class="subnav-end"><i class="bi bi-box-arrow-right"></i> Salir</a>
    </div>
  </nav>

  <main class="page-content">

    <div class="page-header">
      <h1><i class="bi bi-person-plus"></i> Nuevo Cliente</h1>
      <a href="clientes.html" class="btn-secondary"><i class="bi bi-arrow-left"></i> Volver</a>
    </div>

    <section class="form-card">
      <div class="form-card-title"><i class="bi bi-person-plus"></i> Datos del cliente</div>
      <form action="clientes.html">
        <div class="form-group">
          <label for="ci">CI / Cédula</label>
          <input type="text" id="ci" name="ci" placeholder="Ej: 12345678" />
        </div>
        <div class="form-group">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" name="nombre" placeholder="Ej: Carlos Mamani" required />
        </div>
        <div class="form-group">
          <label for="correo">Correo</label>
          <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" />
        </div>
        <div class="form-group">
          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" name="telefono" placeholder="Ej: 70012345" />
        </div>
        <div class="form-group">
          <label for="direccion">Dirección</label>
          <input type="text" id="direccion" name="direccion" placeholder="Ej: La Paz, Bolivia" />
        </div>
        <div class="form-group">
          <label for="notas">Notas</label>
          <textarea id="notas" name="notas" placeholder="Información adicional..."></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary"><i class="bi bi-floppy"></i> Guardar</button>
          <a href="clientes.html" class="btn-cancel"><i class="bi bi-x-lg"></i> Cancelar</a>
        </div>
      </form>
    </section>

  </main>

  <footer class="page-footer">
    <p>© 2026 StyleShop · Sistema de Gestión</p>
  </footer>

</body>
</html>
